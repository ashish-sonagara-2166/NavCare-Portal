<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progress Bar</title>
    <style>
        :root {
            --inactive-bg: #dcdcdc;
            --inactive-border: #cfc0cf;
            --active-bg: blue;
            --active-color: #f3f3f3;
            --bar-bg: rgb(232, 207, 232);
        }

        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        .buttons {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .progress_bar {
            width: 400px;
            display: flex;
            justify-content: space-between;
            position: relative;
            counter-reset: step;
        }

        .progress_bar::before {
            content: "";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 5px;
            background-color: var(--bar-bg);
            z-index: -1;
        }

        #progress {
            content: "";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            height: 5px;
            background-color: var(--active-bg);
            width: 0%;
            z-index: -1;
            transition: 0.4s ease;
        }

        .progress-steps {
            height: 50px;
            width: 50px;
            background-color: var(--inactive-bg);
            border-radius: 50%;
            border: 2px solid var(--inactive-border);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .progress-steps::before {
            counter-increment: step;
            content: counter(step);
            font-weight: bold;
        }

        .progress-steps::after {
            content: attr(data-title);
            position: absolute;
            top: 110%;
            font-size: 12px;
            color: #666;
            white-space: nowrap;
        }

        .progress_active {
            background-color: var(--active-bg);
            color: var(--active-color);
            border-color: var(--active-bg);
        }
    </style>
</head>

<body>
    <div class="buttons">
        <button id="prev">Prev</button>
        <button id="next">Next</button>
    </div>

    <div class="progress_bar">
        <div id="progress"></div>
        <div class="progress-steps progress_active" data-title="First"></div>
        <div class="progress-steps" data-title="Second"></div>
        <div class="progress-steps" data-title="Third"></div>
        <div class="progress-steps" data-title="Fourth"></div>
    </div>

    <script>
        const progress = document.getElementById("progress");
        const steps = document.querySelectorAll(".progress-steps");
        const nextBtn = document.getElementById("next");
        const prevBtn = document.getElementById("prev");
        let currentStep = 1;

        function updateProgress() {
            steps.forEach((step, index) => {
                if (index < currentStep) {
                    step.classList.add("progress_active");
                } else {
                    step.classList.remove("progress_active");
                }
            });

            const progressPercent = ((currentStep - 1) / (steps.length - 1)) * 100;
            progress.style.width = `${progressPercent}%`;
        }

        nextBtn.addEventListener("click", () => {
            if (currentStep < steps.length) {
                currentStep++;
                updateProgress();
            }
        });

        prevBtn.addEventListener("click", () => {
            if (currentStep > 1) {
                currentStep--;
                updateProgress();
            }
        });
    </script>
</body>

</html>
